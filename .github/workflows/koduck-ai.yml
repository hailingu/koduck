# ADR: docs/adr/ADR-0002-required-ai-ci-postgres-verification.md
name: Koduck AI

on:
  pull_request:
    branches:
      - dev
concurrency:
  group: koduck-ai-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar-readiness:
    name: koduck-sonar-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a trusted ephemeral local runner
        env:
          RUNNER_ENABLED: ${{ vars.KODUCK_SONAR_RUNNER_ENABLED }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "$SAME_REPOSITORY" = true || { echo "Local scanner cannot execute fork code"; exit 1; }
          test "$RUNNER_ENABLED" = true || { echo "Start tools/sonarqube/runner.py before rerunning CI"; exit 1; }

  sonar:
    name: koduck-sonar
    needs: sonar-readiness
    runs-on: [self-hosted, koduck-sonarqube]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned coverage tools
        run: sh tools/sonarqube/install.sh
      - name: Scan the exact proposed revision and feature baseline
        env:
          SONAR_REVISION: ${{ github.event.pull_request.head.sha }}
          SONAR_BASE: ${{ github.event.pull_request.base.sha }}
        # The sudoers rule admits only this root-owned wrapper, which runs
        # the image-baked gate tooling as the gate user; the analysis token
        # is never present in any PR-controlled step or subprocess.
        run: sudo /usr/local/bin/koduck-gate check --revision "$SONAR_REVISION" --base "$SONAR_BASE"

  format:
    name: koduck-ai-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/governance-validator/package-lock.json
      - run: npm ci --prefix tools/governance-validator
      - run: npm test --prefix tools/governance-validator
      - run: npm run validate --prefix tools/governance-validator
      - run: python3 -m pip install ruff==0.15.4
      - run: ruff check tools/sonarqube
      - run: ruff format --check tools/sonarqube
      - run: python3 -m unittest discover -s tools/sonarqube -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: koduck-ai-clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: clippy
      - run: cargo clippy -p koduck-ai --all-targets --all-features -- -D warnings

  test-postgres:
    name: koduck-ai-test-postgres
    needs: sonar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: koduck_test
          POSTGRES_USER: koduck
          POSTGRES_PASSWORD: koduck-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koduck -d koduck_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      KODUCK_AI_TEST_DATABASE_URL: postgresql://koduck:koduck-test-only@localhost:5432/koduck_test
    steps:
      - name: Require the Sonar gate behind this existing required check
        env:
          SONAR_RESULT: ${{ needs.sonar.result }}
        run: test "$SONAR_RESULT" = success
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - run: cargo test -p koduck-ai --all-targets --all-features
